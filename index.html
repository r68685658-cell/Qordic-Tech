<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06111f" data-rh="true" />
    <meta
      name="description"
      content="Qordic Technologies (Qordic Tech) offers custom software, websites and portals, mobile applications, AI chatbots, real-estate software, BPO support, graphic design, SEO, video editing and ongoing software support."
      data-rh="true"
    />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/qordic-mark.png" />
    <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/brand/qordic-mark.png" />
    <script>
      (() => {
        const key = "qordic-theme";
        let theme;

        try {
          theme = localStorage.getItem(key);
        } catch (error) {
          console.warn("Unable to read the saved theme preference.", error);
        }

        if (theme !== "light" && theme !== "dark") theme = "dark";

        document.documentElement.dataset.theme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.content = theme === "dark" ? "#06111f" : "#f7fbff";
        }
      })();
    </script>
    <title>Qordic Technologies (Qordic Tech) | Digital Services</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
