<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06111f" data-rh="true" />
    <meta
      name="description"
      content="Qordic Tech (Qordic Technologies) offers custom software, websites, mobile apps and AI chatbots, plus real-estate, BPO, design, SEO, video and support services."
      data-rh="true"
    />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="/assets/brand/favicon.ico" />
    <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/qordic-mark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:url" content="https://qordictech.com/" data-rh="true" />
    <meta property="og:site_name" content="Qordic Technologies" data-rh="true" />
    <meta property="og:title" content="Qordic Tech | Qordic Technologies - Software Development" data-rh="true" />
    <meta property="og:description" content="Qordic Tech (Qordic Technologies) offers custom software, websites, mobile apps and AI chatbots, plus real-estate, BPO, design, SEO, video and support services." data-rh="true" />
    <meta property="og:image" content="https://qordictech.com/assets/brand/qordic-social-share.png" data-rh="true" />
    <meta property="og:image:secure_url" content="https://qordictech.com/assets/brand/qordic-social-share.png" data-rh="true" />
    <meta property="og:image:type" content="image/png" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta property="og:image:alt" content="Qordic Technologies wordmark on a dark blue and violet background." data-rh="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="Qordic Tech | Qordic Technologies - Software Development" data-rh="true" />
    <meta name="twitter:description" content="Qordic Tech (Qordic Technologies) offers custom software, websites, mobile apps and AI chatbots, plus real-estate, BPO, design, SEO, video and support services." data-rh="true" />
    <meta name="twitter:image" content="https://qordictech.com/assets/brand/qordic-social-share.png" data-rh="true" />
    <meta name="twitter:image:alt" content="Qordic Technologies wordmark on a dark blue and violet background." data-rh="true" />
    <script>
      (() => {
        const key = "qordic-theme";
        let theme;

        try {
          theme = localStorage.getItem(key);
        } catch (error) {
          console.warn("Unable to read the saved theme preference.", error);
        }

        if (theme !== "light" && theme !== "dark") theme = "dark";

        document.documentElement.dataset.theme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.content = theme === "dark" ? "#06111f" : "#f7fbff";
        }
      })();
    </script>
    <title>Qordic Tech | Qordic Technologies - Software Development</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
