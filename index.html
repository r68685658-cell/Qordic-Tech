<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050313" />
    <meta
      name="description"
      content="Build the software and support your business needs. Explore custom software, real estate platforms, AI chatbots, mobile apps and outsourced support with Qordic Technologies."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/qordic-mark.png" />
    <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/brand/qordic-mark.png" />
    <script>
      (() => {
        const key = "qordic-theme";
        let theme;

        try {
          theme = localStorage.getItem(key);
        } catch (error) {
          console.warn("Unable to read the saved theme preference.", error);
        }

        if (theme !== "light" && theme !== "dark") theme = "dark";

        document.documentElement.dataset.theme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.content = theme === "dark" ? "#050313" : "#fbfaff";
        }
      })();
    </script>
    <title>Qordic Technologies | Software &amp; Business Support</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
